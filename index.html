<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoRisk-Navigator - Web-GIS Hazard Map</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body, html { height: 100%; margin: 0; padding: 0; }
        #map { width: 100%; height: calc(100vh - 56px); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="#"><i class="fa-solid fa-earth-americas text-warning"></i> GeoRisk-Navigator</a>
        <button class="btn btn-outline-warning btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
            <i class="fa-solid fa-plus"></i> Add Risk Point
        </button>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid h-100 p-0">
        <div class="row g-0 h-100">
            <!-- Map Area -->
            <div class="col-12 h-100 position-relative">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Add Data Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="riskForm">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fa-solid fa-map-pin"></i> Add Hazard Point to Map</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Title / Location Name</label>
                            <input type="text" class="form-control" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hazard Type (Category)</label>
                            <select class="form-select" name="category">
                                <option value="earthquake">Earthquake Fault / Hazard Zone</option>
                                <option value="landslide">Landslide / Slope Failure</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Risk Level</label>
                            <select class="form-select" name="risk_level">
                                <option value="Low">Low Risk</option>
                                <option value="Medium">Medium Risk</option>
                                <option value="High">High Risk</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3"></textarea>
                        </div>
                        <input type="hidden" id="lat" name="lat">
                        <input type="hidden" id="lng" name="lng">
                        <div class="alert alert-info py-2 small mb-0">
                            <i class="fa-solid fa-info-circle"></i> Click anywhere on the map to select coordinates automatically.
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success"><i class="fa-solid fa-save"></i> Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([39.1667, 35.6667], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var tempMarker = null;

        map.on('click', function(e) {
            document.getElementById('lat').value = e.latlng.lat;
            document.getElementById('lng').value = e.latlng.lng;

            if (tempMarker) {
                map.removeLayer(tempMarker);
            }
            tempMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map)
                .bindPopup("Selected Location").openPopup();
        });

        function loadData() {
            fetch('api_getData.php')
                .then(response => response.json())
                .then(data => {
                    L.geoJSON(data, {
                        pointToLayer: function (feature, latlng) {
                            let color = '#28a745'; 
                            if (feature.properties.risk_level === 'Medium') color = '#ffc107'; 
                            if (feature.properties.risk_level === 'High') color = '#dc3545'; 

                            return L.circleMarker(latlng, {
                                radius: 8,
                                fillColor: color,
                                color: "#000",
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.8
                            });
                        },
                        onEachFeature: function (feature, layer) {
                            if (feature.properties) {
                                layer.bindPopup(`
                                    <div>
                                        <h6><i class="fa-solid fa-triangle-exclamation"></i> ${feature.properties.title}</h6>
                                        <hr class="my-1">
                                        <p class="mb-1"><strong>Category:</strong> ${feature.properties.category.toUpperCase()}</p>
                                        <p class="mb-1"><strong>Risk Level:</strong> <span class="badge bg-secondary">${feature.properties.risk_level}</span></p>
                                        <p class="mb-0"><strong>Description:</strong> ${feature.properties.description}</p>
                                    </div>
                                `);
                            }
                        }
                    }).addTo(map);
                });
        }

        loadData();

        document.getElementById('riskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if(!document.getElementById('lat').value) {
                document.getElementById('lat').value = 39.9250;
                document.getElementById('lng').value = 32.8663;
            }

            let formData = new FormData(this);

            fetch('api_addPoint.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if(data.success) {
                    location.reload();
                }
            });
        });
    </script>
</body>
</html>
